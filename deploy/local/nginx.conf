# Local deployment: client (port 80 -> host 8080) + Super Admin (port 81 -> host 8081).
# Bound on the host so the console/app are reachable on the LAN at http://<host>:8080|8081.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/client;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/manifest+json;

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    # Service worker + manifest must never be cached, otherwise updates stall.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite emits content-hashed filenames under /assets, safe to cache hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 81;
    server_name _;
    root /usr/share/nginx/html/admin;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml application/manifest+json;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
