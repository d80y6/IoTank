services:
  iotank-web:
    image: nginx:1.27-alpine
    container_name: iotank-web
    restart: unless-stopped
    ports:
      - "8080:80"   # client app
      - "8081:81"   # Super Admin console
    volumes:
      - ../../dist:/usr/share/nginx/html/client:ro
      - "../../super Admin/dist:/usr/share/nginx/html/admin:ro"
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
